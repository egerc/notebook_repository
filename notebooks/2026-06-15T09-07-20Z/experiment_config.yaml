# logging
log_level: 20
# experiment
seed: 0
mlflow_config:
    run_id: ~
    experiment_id: ~
    run_name: lol
    nested: False
    parent_run_id: ~
    tags: ~
    description: ~
    log_system_metrics: ~
sampling_config:
    n_samples: 2
    sample_length: 20
predictors:
    - name: MofaFlex (3 components)
      scope: celltype
      transform: ~
      model:
          type: mofaflex
          n_components: 3
    - name: MofaFlex (3 components)
      scope: global
      transform: ~
      model:
          type: mofaflex
          n_components: 3
    - name: Tangram
      scope: global
      transform: ~
      model:
          type: tangram
    - name: Tangram
      scope: celltype
      transform: ~
      model:
          type: tangram
    - name: NMF (3 components)
      scope: celltype
      transform: ~
      model:
          type: nmf
          n_components: 3
    - name: NMF (3 components)
      scope: global
      transform: ~
      model:
          type: nmf
          n_components: 3
    - name: NMF (5 components)
      scope: celltype
      transform: log
      model:
          type: nmf
          n_components: 5
    - name: NMF (5 components)
      scope: global
      transform: log
      model:
          type: nmf
          n_components: 5
    - name: NMF (10 components)
      scope: celltype
      transform: log
      model:
          type: nmf
          n_components: 10
    - name: NMF (10 components)
      scope: global
      transform: ~
      model:
          type: nmf
          n_components: 10
    - name: NMF (Consensus)
      scope: celltype
      transform: ~
      model:
          type: nmf
          n_components: consensus
    - name: NMF (Consensus)
      scope: global
      transform: ~
      model:
          type: nmf
          n_components: consensus
    - name: NMF (3 components)
      scope: celltype
      transform: log
      model:
          type: nmf
          n_components: 3
    - name: NMF (3 components)
      scope: global
      transform: log
      model:
          type: nmf
          n_components: 3
    - name: PCA (3 components)
      scope: celltype
      transform: ~
      model:
          type: pca
          n_components: 3
    - name: PCA (3 components)
      scope: global
      transform: ~
      model:
          type: pca
          n_components: 3
    - name: PCA (3 components)
      scope: celltype
      transform: log
      model:
          type: pca
          n_components: 3
    - name: PCA (3 components)
      scope: global
      transform: log
      model:
          type: pca
          n_components: 3
    - name: scVI (3 Components)
      scope: global
      transform: ~
      model:
          type: scvi
          n_components: 3
          max_epochs: 200
    - name: scVI (3 Components)
      scope: celltype
      transform: ~
      model:
          type: scvi
          n_components: 3
          max_epochs: 200
datasets:
    - name: "Mouse Intestine"
      query_path: "/home/gruengroup/christian/Data/mouse_intestine/intestine_MERFISH.h5ad"
      query_cluster_key: "C_scanvi"
      reference_path: "/home/gruengroup/christian/Projects/notebook_repository/notebooks/data/mouse_small_intestine_sc/mouse_small_intestine_sc.h5ad"
      reference_cluster_key: "cluster"
      min_n_cells_celltype: 20
      n_cells: 500
      max_n_pcs: 10
      max_n_neighbours: 6
    - name: Andy Spatial
      query_path: /home/gruengroup/christian/Data/benchmark_sample_data/andy_spatial_downsampled.h5ad
      query_cluster_key: "nico_ct"
      reference_path: /home/gruengroup/christian/Data/benchmark_sample_data/andy_reference_downsampled.h5ad
      reference_cluster_key: "simple_annot"
      min_n_cells_celltype: 20
      n_cells: 500
      max_n_pcs: 10
      max_n_neighbours: 6
    - type: spatial
      name: Jennifer Spatial
      query_path: /home/gruengroup/christian/Data/benchmark_sample_data/jennifer_spatial_downsampled.h5ad
      query_cluster_key: Tacco_pred_cell_type
